<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Test Page</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
    h1 { border-bottom: 2px solid #4a6cf7; padding-bottom: .25rem; }
    button { padding: .5rem 1rem; border: 0; border-radius: 6px; background: #4a6cf7; color: #fff; cursor: pointer; }
    button:hover { background: #3652d9; }
    input { padding: .45rem; border: 1px solid #bbb; border-radius: 6px; }
    #output { margin-top: 1rem; font-weight: 600; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ddd; padding: .4rem .6rem; text-align: left; }
    th { background: #f3f4f8; }
  </style>
</head>
<body>
  <h1>Sample Test Page</h1>
  <p>This is a simple HTML file for testing: headings, a form, a button with JavaScript, a list and a table.</p>

  <h2>Greeting form</h2>
  <input id="name" type="text" placeholder="Enter your name">
  <button id="greet">Say hello</button>
  <div id="output"></div>

  <h2>List</h2>
  <ul>
    <li>First item</li>
    <li>Second item</li>
    <li>Third item</li>
  </ul>

  <h2>Table</h2>
  <table>
    <tr><th>ID</th><th>Name</th><th>Status</th></tr>
    <tr><td>1</td><td>Alpha</td><td>Active</td></tr>
    <tr><td>2</td><td>Beta</td><td>Pending</td></tr>
    <tr><td>3</td><td>Gamma</td><td>Done</td></tr>
  </table>

  <script>
    document.getElementById('greet').addEventListener('click', function () {
      var name = document.getElementById('name').value.trim() || 'friend';
      document.getElementById('output').textContent = 'Hello, ' + name + '! It is ' + new Date().toLocaleTimeString() + '.';
    });
  </script>
</body>
</html>
